name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo build files
        uses: Swatinem/rust-cache@v2
      - name: Check all workspace targets
        run: cargo check --locked --workspace --all-targets
      - name: Test all workspace targets
        run: cargo test --locked --workspace --all-targets
      - name: Check server CLI
        run: cargo run --locked -p rustmp-server -- --help
      - name: Check PCAP inspector CLI
        run: cargo run --locked -p rustmp-protocol --bin rustmp-trace -- --help
